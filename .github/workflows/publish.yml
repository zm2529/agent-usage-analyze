name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package version
        run: pnpm release:verify-tag

      - name: Verify npm package and OIDC configuration
        run: pnpm release:check-publish

      - name: Check whether this version is already published
        id: published
        shell: bash
        run: |
          version=$(node -p "require('./cli/package.json').version")
          if npm view "agent-usage-analyze@${version}" version --json >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run deterministic release tests
        run: pnpm test:release

      - name: Build all runtime assets
        run: pnpm build

      - name: Audit legal, provenance, secrets, and package contents
        run: pnpm audit:v1

      - name: Verify the packed package installs and runs
        run: pnpm package:smoke

      - name: Publish with npm Trusted Publishing
        if: steps.published.outputs.already_published != 'true'
        working-directory: cli
        run: npm publish --access public
